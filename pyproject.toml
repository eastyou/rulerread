[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rulerread"
version = "0.1.0"
description = "厘米尺读数：长度换算、SVG 尺子与可打印练习纸"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "measurement", "ruler", "math", "worksheet", "printable"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]
dependencies = []

[project.scripts]
rulerread = "rulerread.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/rulerread"
Source = "https://github.com/eastyou/rulerread"

[tool.setuptools]
packages = ["rulerread"]
